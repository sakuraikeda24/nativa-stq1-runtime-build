      - name: Generate legal SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import hashlib

          legal = (
              Path("dist")
              / "llama-mac-arm64-b10516"
              / "legal"
          )

          manifest = legal / "LEGAL_MANIFEST.sha256"

          rows = []

          for file in sorted(
              p for p in legal.rglob("*")
              if p.is_file()
              and p.name != "LEGAL_MANIFEST.sha256"
          ):
              data = file.read_bytes()

              digest = hashlib.sha256(data).hexdigest()

              rel = file.relative_to(legal).as_posix()

              rows.append(f"{digest}  {rel}")

          if not rows:
              raise SystemExit(
                  "legal bundle contains no files"
              )

          manifest.write_text(
              "\n".join(rows) + "\n",
              encoding="utf-8",
          )

          print(
              f"LEGAL_MANIFEST.sha256 generated: "
              f"{len(rows)} files"
          )
          PY

      - name: Re-verify complete legal manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import re

          legal = (
              Path("dist")
              / "llama-mac-arm64-b10516"
              / "legal"
          )

          manifest = legal / "LEGAL_MANIFEST.sha256"

          seen = set()
          checked = 0

          for raw in manifest.read_text(
              encoding="utf-8"
          ).splitlines():
              if not raw.strip():
                  continue

              match = re.fullmatch(
                  r"([0-9a-f]{64})  (.+)",
                  raw
              )

              if not match:
                  raise SystemExit(
                      f"Malformed manifest line: {raw}"
                  )

              expected, rel = match.groups()

              if rel in seen:
                  raise SystemExit(
                      f"Duplicate manifest entry: {rel}"
                  )

              seen.add(rel)

              target = legal / rel

              if not target.is_file():
                  raise SystemExit(
                      f"Manifest file missing: {rel}"
                  )

              actual = hashlib.sha256(
                  target.read_bytes()
              ).hexdigest()

              if actual != expected:
                  raise SystemExit(
                      f"Manifest mismatch: {rel}"
                  )

              checked += 1

          actual_files = {
              p.relative_to(legal).as_posix()
              for p in legal.rglob("*")
              if p.is_file()
              and p.name != "LEGAL_MANIFEST.sha256"
          }

          if actual_files != seen:
              missing = sorted(actual_files - seen)
              extra = sorted(seen - actual_files)

              raise SystemExit(
                  f"Manifest coverage mismatch. "
                  f"Unlisted={missing} missing={extra}"
              )

          print(
              f"Legal manifest PASS: {checked} files verified"
          )
          PY

      - name: Safety audit legal-only payload
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          root = (
              Path("dist")
              / "llama-mac-arm64-b10516"
          )

          legal = root / "legal"

          forbidden_suffixes = {
              ".dylib",
              ".so",
              ".dll",
              ".exe",
              ".gguf",
              ".app",
              ".bin",
              ".a",
              ".o",
              ".obj",
          }

          forbidden_magics = [
              b"\x7fELF",
              b"MZ",
              bytes.fromhex("feedface"),
              bytes.fromhex("cefaedfe"),
              bytes.fromhex("feedfacf"),
              bytes.fromhex("cffaedfe"),
              bytes.fromhex("cafebabe"),
              bytes.fromhex("bebafeca"),
          ]

          all_files = [
              p for p in root.rglob("*")
              if p.is_file()
          ]

          if not all_files:
              raise SystemExit(
                  "No legal files produced"
              )

          for file in all_files:
              try:
                  file.relative_to(legal)
              except ValueError:
                  raise SystemExit(
                      f"Non-legal payload found: {file}"
                  )

              if file.suffix.lower() in forbidden_suffixes:
                  raise SystemExit(
                      f"Forbidden binary/model suffix: {file}"
                  )

              head = file.read_bytes()[:4]

              if any(
                  head.startswith(magic)
                  for magic in forbidden_magics
              ):
                  raise SystemExit(
                      f"Binary magic detected in legal bundle: {file}"
                  )

          print(
              f"Legal-only payload PASS: "
              f"{len(all_files)} files"
          )
          PY

      - name: Build deterministic legal notice ZIP
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import zipfile

          final_root = os.environ["FINAL_ROOT"]
          final_zip = os.environ["FINAL_ZIP"]

          source = Path("dist") / final_root

          if not source.is_dir():
              raise SystemExit(
                  f"source root missing: {source}"
              )

          out = Path(final_zip)

          if out.exists():
              out.unlink()

          files = sorted(
              p for p in source.rglob("*")
              if p.is_file()
          )

          with zipfile.ZipFile(
              out,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9,
          ) as zf:
              for file in files:
                  rel = file.relative_to(source).as_posix()

                  arcname = (
                      f"{final_root}/{rel}"
                  )

                  info = zipfile.ZipInfo(
                      arcname,
                      date_time=(1980, 1, 1, 0, 0, 0),
                  )

                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  info.create_system = 3

                  zf.writestr(
                      info,
                      file.read_bytes(),
                      compress_type=zipfile.ZIP_DEFLATED,
                      compresslevel=9,
                  )

          print(
              f"Deterministic ZIP ready: {out}"
          )
          PY

          zip_sha="$(sha256sum "$FINAL_ZIP" | awk '{print $1}')"
          zip_bytes="$(stat -c '%s' "$FINAL_ZIP")"

          printf '%s  %s\n' \
            "$zip_sha" \
            "$FINAL_ZIP" \
            > "$FINAL_ZIP.sha256"

          echo "FINAL_ZIP_NAME=$FINAL_ZIP"
          echo "FINAL_ZIP_BYTES=$zip_bytes"
          echo "FINAL_ZIP_SHA256=$zip_sha"

      - name: Independently inspect final ZIP payload
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import zipfile

          final_root = os.environ["FINAL_ROOT"]
          final_zip = os.environ["FINAL_ZIP"]

          prefix = f"{final_root}/legal/"

          forbidden = (
              ".dylib",
              ".so",
              ".dll",
              ".exe",
              ".gguf",
              ".app",
              ".bin",
              ".a",
              ".o",
              ".obj",
          )

          with zipfile.ZipFile(final_zip, "r") as zf:
              names = zf.namelist()

              if not names:
                  raise SystemExit(
                      "Final ZIP is empty"
                  )

              if len(names) != len(set(names)):
                  raise SystemExit(
                      "Duplicate ZIP entries found"
                  )

              for name in names:
                  if "\\" in name:
                      raise SystemExit(
                          f"Backslash ZIP path rejected: {name}"
                      )

                  if name.startswith("/"):
                      raise SystemExit(
                          f"Absolute ZIP path rejected: {name}"
                      )

                  parts = name.split("/")

                  if ".." in parts or "." in parts:
                      raise SystemExit(
                          f"Unsafe ZIP path rejected: {name}"
                      )

                  if not name.startswith(prefix):
                      raise SystemExit(
                          f"Payload outside legal prefix: {name}"
                      )

                  lower = name.lower()

                  if lower.endswith(forbidden):
                      raise SystemExit(
                          f"Forbidden binary/model in ZIP: {name}"
                      )

              required = {
                  f"{prefix}LEGAL_SOURCE.txt",
                  f"{prefix}LEGAL_MANIFEST.sha256",
                  f"{prefix}THIRD_PARTY_NOTICES.txt",
                  f"{prefix}CPP_COMPONENT_INVENTORY.txt",
                  f"{prefix}UI_NPM_INVENTORY.json",
                  f"{prefix}UI_PRODUCTION_PACKAGE_SET.txt",
                  f"{prefix}UI_PRODUCTION_SOURCE_MAPS.txt",
                  f"{prefix}REVIEWED_EXCEPTIONS.txt",
                  f"{prefix}UNRESOLVED.txt",
                  f"{prefix}UNRESOLVED_COUNT.txt",
              }

              missing = sorted(
                  required - set(names)
              )

              if missing:
                  raise SystemExit(
                      f"Required legal files missing: {missing}"
                  )

          print(
              f"Final ZIP safety audit PASS: "
              f"{len(names)} files"
          )
          PY

      - name: Export audit reports
        if: always()
        shell: bash
        run: |
          set -u

          mkdir -p audit-export

          legal="dist/$FINAL_ROOT/legal"

          for name in \
            LEGAL_SOURCE.txt \
            LEGAL_MANIFEST.sha256 \
            THIRD_PARTY_NOTICES.txt \
            CPP_COMPONENT_INVENTORY.txt \
            UI_NPM_INVENTORY.json \
            UI_PRODUCTION_PACKAGE_SET.txt \
            UI_PRODUCTION_SOURCE_MAPS.txt \
            REVIEWED_EXCEPTIONS.txt \
            UNRESOLVED.txt \
            UNRESOLVED_COUNT.txt
          do
            if [ -f "$legal/$name" ]; then
              cp "$legal/$name" "audit-export/$name"
            fi
          done

          if [ -f "$FINAL_ZIP.sha256" ]; then
            cp "$FINAL_ZIP.sha256" audit-export/
          fi

      - name: Upload macOS notice audit artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nativa-llama-b10516-macos-notices-v1-audit
          path: |
            nativa-llama-b10516-macos-notices-v1.zip
            nativa-llama-b10516-macos-notices-v1.zip.sha256
            audit-export/
          if-no-files-found: warn
          retention-days: 30

      - name: Final automated licence gate
        shell: bash
        run: |
          set -euo pipefail

          count_file="dist/$FINAL_ROOT/legal/UNRESOLVED_COUNT.txt"

          if [ ! -f "$count_file" ]; then
            echo "::error::UNRESOLVED_COUNT.txt missing"
            exit 1
          fi

          count="$(tr -d '[:space:]' < "$count_file")"

          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid unresolved count: $count"
            exit 1
          fi

          if [ "$count" -ne 0 ]; then
            echo "::error::macOS NOTICE audit found $count item(s) requiring manual review. Inspect the uploaded audit artifact. No Release should be created yet."
            exit 1
          fi

          echo "=================================================="
          echo "macOS NOTICE automated audit PASS"
          echo "Zero unresolved licence findings"
          echo "Artifact is ready for independent acceptance review"
          echo "Do NOT create a Release until independent review"
          echo "=================================================="
