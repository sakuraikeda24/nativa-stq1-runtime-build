name: Audit and package Nativa macOS b10516 notices v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      EXPECTED_LLAMA_COMMIT: b95502ba9aa0eb73a2f4fc8878d7fbe6a847a0b9

      OFFICIAL_MAC_URL: "https://github.com/ggml-org/llama.cpp/releases/download/b10516/llama-b10516-bin-macos-arm64.tar.gz"
      OFFICIAL_MAC_SHA256: ee3324327d621026ae80c24031670e65fa62a0b23a3a027dbe2f65f240affd30

      BORINGSSL_VERSION: "0.20260813.0"

      FINAL_ROOT: llama-mac-arm64-b10516
      FINAL_ZIP: nativa-llama-b10516-macos-notices-v1.zip

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Fetch exact llama.cpp b10516
        shell: bash
        run: |
          set -euo pipefail

          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin refs/tags/b10516
          git -C llama.cpp checkout --detach FETCH_HEAD

          actual="$(git -C llama.cpp rev-parse HEAD)"

          echo "Expected commit: $EXPECTED_LLAMA_COMMIT"
          echo "Actual commit:   $actual"

          if [ "$actual" != "$EXPECTED_LLAMA_COMMIT" ]; then
            echo "::error::b10516 resolved to unexpected commit $actual"
            exit 1
          fi

          echo "Frozen llama.cpp b10516 commit PASS"

      - name: Verify frozen macOS release build facts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audit-export

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path("llama.cpp")
          release = (root / ".github/workflows/release.yml").read_text(
              encoding="utf-8"
          )

          if "  macos-cpu:" not in release:
              raise SystemExit("macos-cpu section not found in exact b10516 release workflow")

          tail = release.split("  macos-cpu:", 1)[1]

          if "\n  ubuntu-cpu:" not in tail:
              raise SystemExit("could not bound macos-cpu section")

          mac = tail.split("\n  ubuntu-cpu:", 1)[0]

          required = [
              '-DLLAMA_BUILD_BORINGSSL=ON',
              'cache-dependency-path: "tools/ui/package-lock.json"',
              'cp LICENSE ./build/bin/',
          ]

          for item in required:
              if item not in mac:
                  raise SystemExit(
                      f"required frozen macOS release fact missing: {item}"
                  )

          root_cmake = (root / "CMakeLists.txt").read_text(
              encoding="utf-8"
          )

          if not re.search(
              r'option\(LLAMA_BUILD_UI\s+"[^"]*"\s+ON\)',
              root_cmake,
          ):
              raise SystemExit(
                  "LLAMA_BUILD_UI=ON default not found in exact b10516"
              )

          evidence = f"""Nativa macOS b10516 release build evidence

          llama.cpp tag:
          b10516

          llama.cpp expected commit:
          {os.environ["EXPECTED_LLAMA_COMMIT"]}

          Official macOS release workflow facts:
          - macos-cpu exists
          - LLAMA_BUILD_BORINGSSL=ON
          - Node/npm cache authority is tools/ui/package-lock.json
          - upstream LICENSE is copied into build/bin before packaging
          - LLAMA_BUILD_UI defaults ON

          Result:
          PASS
          """

          Path("audit-export/BUILD_EVIDENCE.txt").write_text(
              evidence,
              encoding="utf-8",
          )

          print("Frozen macOS release build facts PASS")
          PY

          if ! grep -Fq 'set(BORINGSSL_VERSION "0.20260813.0"' \
            llama.cpp/vendor/cpp-httplib/CMakeLists.txt; then
            echo "::error::Expected BoringSSL version not found in exact b10516"
            exit 1
          fi

          echo "Frozen BoringSSL version declaration PASS"

      - name: Download and verify official macOS arm64 runtime archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p official-mac

          archive="official-mac/llama-b10516-bin-macos-arm64.tar.gz"

          curl \
            --location \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            --output "$archive" \
            "$OFFICIAL_MAC_URL"

          actual="$(sha256sum "$archive" | awk '{print $1}')"

          echo "Expected archive SHA-256: $OFFICIAL_MAC_SHA256"
          echo "Actual archive SHA-256:   $actual"

          if [ "$actual" != "$OFFICIAL_MAC_SHA256" ]; then
            echo "::error::Official macOS b10516 archive SHA-256 mismatch"
            exit 1
          fi

          tar -tzf "$archive" > audit-export/OFFICIAL_MAC_ARCHIVE_CONTENTS.txt

          license_entry="$(
            grep -E '(^|/)LICENSE$' \
              audit-export/OFFICIAL_MAC_ARCHIVE_CONTENTS.txt \
              | head -n 1 || true
          )"

          if [ -z "$license_entry" ]; then
            echo "::error::Official Mac archive does not contain upstream LICENSE"
            exit 1
          fi

          server_entry="$(
            grep -E '(^|/)llama-server$' \
              audit-export/OFFICIAL_MAC_ARCHIVE_CONTENTS.txt \
              | head -n 1 || true
          )"

          if [ -z "$server_entry" ]; then
            echo "::error::Official Mac archive does not contain llama-server"
            exit 1
          fi

          tar -xOf "$archive" "$license_entry" \
            > official-mac/LICENSE-from-runtime

          if ! cmp -s \
            llama.cpp/LICENSE \
            official-mac/LICENSE-from-runtime; then
            echo "::error::Runtime archive LICENSE does not match exact b10516 source LICENSE"
            exit 1
          fi

          echo "Official macOS arm64 archive identity PASS"
          echo "Official runtime LICENSE/source match PASS"

      - name: Fetch exact BoringSSL licence source
        shell: bash
        run: |
          set -euo pipefail

          git init boringssl
          git -C boringssl remote add origin \
            https://boringssl.googlesource.com/boringssl

          git -C boringssl fetch \
            --depth 1 \
            origin \
            "refs/tags/${BORINGSSL_VERSION}"

          git -C boringssl checkout --detach FETCH_HEAD

          boring_commit="$(git -C boringssl rev-parse HEAD)"

          if [ ! -f boringssl/LICENSE ]; then
            echo "::error::BoringSSL LICENSE not found at frozen version"
            exit 1
          fi

          echo "BoringSSL version: $BORINGSSL_VERSION"
          echo "BoringSSL commit:  $boring_commit"

          echo "BORINGSSL_COMMIT=$boring_commit" >> "$GITHUB_ENV"

      - name: Build frozen C and C++ licence inventory
        shell: bash
        run: |
          set -euo pipefail

          legal="dist/$FINAL_ROOT/legal"
          licenses="$legal/licenses"

          rm -rf dist
          mkdir -p "$licenses"

          cp \
            llama.cpp/LICENSE \
            "$licenses/llama.cpp-MIT.txt"

          cp \
            llama.cpp/vendor/cpp-httplib/LICENSE \
            "$licenses/cpp-httplib-MIT.txt"

          cp \
            llama.cpp/vendor/hash/xxhash/LICENSE \
            "$licenses/xxHash-LICENSE.txt"

          cp \
            llama.cpp/vendor/hash/sha256/LICENSE \
            "$licenses/sha256-LICENSE.txt"

          cp \
            llama.cpp/vendor/hash/rotate-bits/LICENSE.md \
            "$licenses/rotate-bits-LICENSE.md"

          cp \
            boringssl/LICENSE \
            "$licenses/BoringSSL-LICENSE.txt"

          if ! grep -Fq \
            "9634bedb5b5a2ca38c1ee7108a9358a4e233f14d" \
            llama.cpp/scripts/sync_vendor.py; then
            echo "::error::Frozen miniaudio commit missing from exact b10516"
            exit 1
          fi

          if ! grep -Fq \
            "9ce0d701b6fb10f8f8c4445edd31e7c60a1237e3" \
            llama.cpp/scripts/sync_vendor.py; then
            echo "::error::Frozen sheredom/subprocess commit missing from exact b10516"
            exit 1
          fi

          if ! grep -Fq \
            "v0.53.1" \
            llama.cpp/scripts/sync_vendor.py; then
            echo "::error::Frozen cpp-httplib version missing from exact b10516"
            exit 1
          fi

          if ! grep -Fq \
            "#define NLOHMANN_JSON_VERSION_MAJOR 3" \
            llama.cpp/vendor/nlohmann/json.hpp; then
            echo "::error::nlohmann/json major version evidence missing"
            exit 1
          fi

          if ! grep -Fq \
            "#define NLOHMANN_JSON_VERSION_MINOR 12" \
            llama.cpp/vendor/nlohmann/json.hpp; then
            echo "::error::nlohmann/json minor version evidence missing"
            exit 1
          fi

          if ! grep -Fq \
            "#define NLOHMANN_JSON_VERSION_PATCH 0" \
            llama.cpp/vendor/nlohmann/json.hpp; then
            echo "::error::nlohmann/json patch version evidence missing"
            exit 1
          fi

          curl \
            --location \
            --fail \
            --retry 3 \
            --output "$licenses/nlohmann-json-MIT.txt" \
            "https://raw.githubusercontent.com/nlohmann/json/v3.12.0/LICENSE.MIT"

          curl \
            --location \
            --fail \
            --retry 3 \
            --output "$licenses/miniaudio-LICENSE.txt" \
            "https://raw.githubusercontent.com/mackron/miniaudio/9634bedb5b5a2ca38c1ee7108a9358a4e233f14d/LICENSE"

          curl \
            --location \
            --fail \
            --retry 3 \
            --output "$licenses/sheredom-subprocess-LICENSE.txt" \
            "https://raw.githubusercontent.com/sheredom/subprocess.h/9ce0d701b6fb10f8f8c4445edd31e7c60a1237e3/LICENSE"

          python3 <<'PY'
          from pathlib import Path

          root = Path("llama.cpp")
          licenses = Path("dist") / "llama-mac-arm64-b10516" / "legal" / "licenses"

          stb = (
              root / "vendor/stb/stb_image.h"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          )

          marker = (
              "This software is available under 2 licenses -- "
              "choose whichever you prefer."
          )

          idx = stb.rfind(marker)

          if idx < 0:
              raise SystemExit("Could not locate stb_image licence block")

          (licenses / "stb_image-LICENSE.txt").write_text(
              stb[idx:].strip() + "\n",
              encoding="utf-8",
          )

          sha1 = (
              root / "vendor/hash/sha1/sha1.c"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          )

          if not sha1.startswith("/*"):
              raise SystemExit("SHA-1 source does not start with expected notice")

          end = sha1.find("*/")

          if end < 0:
              raise SystemExit("Could not locate SHA-1 notice terminator")

          (licenses / "sha1-PUBLIC-DOMAIN.txt").write_text(
              sha1[: end + 2].strip() + "\n",
              encoding="utf-8",
          )
          PY

          cat > "$legal/CPP_COMPONENT_INVENTORY.txt" <<EOF
          Nativa macOS b10516 C/C++ licence inventory

          1. llama.cpp / ggml
             Version: b10516
             Commit: $EXPECTED_LLAMA_COMMIT
             Licence file: licenses/llama.cpp-MIT.txt

          2. cpp-httplib
             Version: v0.53.1
             Licence file: licenses/cpp-httplib-MIT.txt

          3. nlohmann/json
             Version: 3.12.0
             Licence file: licenses/nlohmann-json-MIT.txt

          4. BoringSSL
             Version: $BORINGSSL_VERSION
             Commit: $BORINGSSL_COMMIT
             Licence file: licenses/BoringSSL-LICENSE.txt

          5. miniaudio
             Commit: 9634bedb5b5a2ca38c1ee7108a9358a4e233f14d
             Licence file: licenses/miniaudio-LICENSE.txt

          6. stb_image
             Vendored by exact llama.cpp b10516
             Licence file: licenses/stb_image-LICENSE.txt

          7. sheredom/subprocess.h
             Commit: 9ce0d701b6fb10f8f8c4445edd31e7c60a1237e3
             Licence file: licenses/sheredom-subprocess-LICENSE.txt

          8. xxHash
             Vendored by exact llama.cpp b10516
             Licence file: licenses/xxHash-LICENSE.txt

          9. SHA-1 implementation
             Vendored by exact llama.cpp b10516
             Notice file: licenses/sha1-PUBLIC-DOMAIN.txt

          10. sha256.c
              Vendored by exact llama.cpp b10516
              Licence file: licenses/sha256-LICENSE.txt

          11. rotate-bits.h
              Vendored by exact llama.cpp b10516
              Licence file: licenses/rotate-bits-LICENSE.md

          System Apple frameworks are not redistributed by this package.
          No model bytes are included in this legal bundle.
          EOF

          echo "Frozen C/C++ licence inventory ready"

      - name: Install exact embedded UI dependency tree without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail

          ui="llama.cpp/tools/ui"

          if [ ! -f "$ui/package-lock.json" ]; then
            echo "::error::Exact b10516 UI package-lock.json missing"
            exit 1
          fi

          lock_sha="$(sha256sum "$ui/package-lock.json" | awk '{print $1}')"

          echo "Exact b10516 UI package-lock SHA-256:"
          echo "$lock_sha"

          echo "UI_LOCK_SHA256=$lock_sha" >> "$GITHUB_ENV"

          (
            cd "$ui"
            npm ci \
              --ignore-scripts \
              --no-audit \
              --no-fund
          )

          echo "Exact UI dependency tree installed with lifecycle scripts disabled"
      - name: Build exact production embedded UI with source maps
        shell: bash
        run: |
          set -euo pipefail

          ui="llama.cpp/tools/ui"

          (
            cd "$ui"

            rm -rf audit-ui-dist .svelte-kit

            export LLAMA_UI_OUT_DIR="$PWD/audit-ui-dist"

            npm run build-pwa-assets

            ./node_modules/.bin/vite build --sourcemap

            if [ ! -f "$LLAMA_UI_OUT_DIR/index.html" ]; then
              echo "::error::Production UI audit build did not produce index.html"
              exit 1
            fi

            map_count="$(
              find "$LLAMA_UI_OUT_DIR" \
                -type f \
                -name '*.map' \
                | wc -l \
                | tr -d '[:space:]'
            )"

            if ! [[ "$map_count" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not determine production UI source-map count"
              exit 1
            fi

            if [ "$map_count" -eq 0 ]; then
              echo "::error::Production UI audit build produced zero source maps"
              exit 1
            fi

            echo "Production UI audit output:"
            echo "$LLAMA_UI_OUT_DIR"

            echo "Production UI source maps:"
            echo "$map_count"

            echo "UI_AUDIT_OUT_DIR=$LLAMA_UI_OUT_DIR" >> "$GITHUB_ENV"
            echo "UI_SOURCE_MAP_COUNT=$map_count" >> "$GITHUB_ENV"
          )

          echo "Exact production embedded UI source-map build PASS"

      - name: Build production-bundle npm licence inventory
        shell: bash
        run: |
          set -euo pipefail

          legal="dist/$FINAL_ROOT/legal"
          mkdir -p "$legal/licenses/npm"

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const { fileURLToPath } = require("url");

          const uiRoot = path.resolve("llama.cpp/tools/ui");
          const lockPath = path.join(uiRoot, "package-lock.json");

          const outDir = process.env.UI_AUDIT_OUT_DIR
            ? path.resolve(process.env.UI_AUDIT_OUT_DIR)
            : path.join(uiRoot, "audit-ui-dist");

          const legalRoot = path.resolve(
            "dist",
            "llama-mac-arm64-b10516",
            "legal"
          );

          const npmLicenseRoot = path.join(
            legalRoot,
            "licenses",
            "npm"
          );

          fs.mkdirSync(npmLicenseRoot, { recursive: true });

          if (!fs.existsSync(outDir)) {
            throw new Error(
              `Production UI audit output missing: ${outDir}`
            );
          }

          const lock = JSON.parse(
            fs.readFileSync(lockPath, "utf8")
          );

          if (!lock.packages || typeof lock.packages !== "object") {
            throw new Error(
              "package-lock.json does not contain a packages object"
            );
          }

          const sha256 = (buf) =>
            crypto
              .createHash("sha256")
              .update(buf)
              .digest("hex");

          const safeName = (value) =>
            value
              .replace(/^@/, "")
              .replace(/[\/\\:@\s]+/g, "__")
              .replace(/[^A-Za-z0-9._+-]/g, "_");

          const walkFiles = (root, predicate) => {
            const result = [];

            const visit = (dir) => {
              for (const entry of fs.readdirSync(
                dir,
                { withFileTypes: true }
              )) {
                const abs = path.join(dir, entry.name);

                if (entry.isDirectory()) {
                  visit(abs);
                } else if (
                  entry.isFile() &&
                  predicate(abs)
                ) {
                  result.push(abs);
                }
              }
            };

            visit(root);

            return result.sort((a, b) =>
              a.localeCompare(b)
            );
          };

          const mapFiles = walkFiles(
            outDir,
            (file) => file.endsWith(".map")
          );

          if (mapFiles.length === 0) {
            throw new Error(
              "Production UI output contains zero source maps"
            );
          }

          const lockEntries = Object.entries(lock.packages)
            .filter(([key, entry]) =>
              key &&
              key.includes("node_modules/") &&
              entry &&
              typeof entry === "object"
            )
            .map(([key, entry]) => {
              const normalizedKey =
                key.replace(/\\/g, "/");

              const parts =
                normalizedKey.split("/");

              let idx = -1;

              for (let i = parts.length - 1; i >= 0; i--) {
                if (parts[i] === "node_modules") {
                  idx = i;
                  break;
                }
              }

              if (idx < 0 || !parts[idx + 1]) {
                return null;
              }

              let name;

              if (parts[idx + 1].startsWith("@")) {
                if (!parts[idx + 2]) {
                  return null;
                }

                name =
                  `${parts[idx + 1]}/${parts[idx + 2]}`;
              } else {
                name = parts[idx + 1];
              }

              return {
                key: normalizedKey,
                name,
                version:
                  typeof entry.version === "string"
                    ? entry.version
                    : null,
                entry,
              };
            })
            .filter(Boolean);

          const lockByKey = new Map(
            lockEntries.map((item) => [
              item.key,
              item,
            ])
          );

          const lockByName = new Map();

          for (const item of lockEntries) {
            if (!lockByName.has(item.name)) {
              lockByName.set(item.name, []);
            }

            lockByName.get(item.name).push(item);
          }

          const lockKeysLongestFirst =
            [...lockByKey.keys()].sort(
              (a, b) => b.length - a.length
            );

          const normalizeSourceText = (value) => {
            let text = String(value || "")
              .replace(/\\/g, "/");

            try {
              text = decodeURIComponent(text);
            } catch {
              // Preserve the original text when URI decoding fails.
            }

            if (text.startsWith("\0")) {
              text = text.slice(1);
            }

            return text;
          };

          const sourcePackageName = (source) => {
            const normalized =
              normalizeSourceText(source);

            const marker = "/node_modules/";
            let idx =
              normalized.lastIndexOf(marker);

            let tail;

            if (idx >= 0) {
              tail = normalized.slice(
                idx + marker.length
              );
            } else if (
              normalized.startsWith("node_modules/")
            ) {
              tail = normalized.slice(
                "node_modules/".length
              );
            } else {
              return null;
            }

            const parts = tail.split("/");

            if (!parts[0]) {
              return null;
            }

            if (parts[0].startsWith("@")) {
              if (!parts[1]) {
                return null;
              }

              return `${parts[0]}/${parts[1]}`;
            }

            return parts[0];
          };

          const nearestLockKeyForAbsolutePath =
            (absPath) => {
              let current = absPath;

              try {
                if (
                  fs.existsSync(current) &&
                  fs.statSync(current).isFile()
                ) {
                  current = path.dirname(current);
                }
              } catch {
                return null;
              }

              const uiPrefix =
                uiRoot.endsWith(path.sep)
                  ? uiRoot
                  : `${uiRoot}${path.sep}`;

              while (
                current === uiRoot ||
                current.startsWith(uiPrefix)
              ) {
                const rel = path
                  .relative(uiRoot, current)
                  .replace(/\\/g, "/");

                if (lockByKey.has(rel)) {
                  return rel;
                }

                const parent = path.dirname(current);

                if (parent === current) {
                  break;
                }

                current = parent;
              }

              return null;
            };

          const resolveSourceCandidates =
            (rawSource, mapFile, sourceRoot) => {
              let combined = rawSource;

              if (
                sourceRoot &&
                typeof sourceRoot === "string"
              ) {
                const root =
                  normalizeSourceText(sourceRoot);

                if (root) {
                  combined =
                    `${root.replace(/\/+$/, "")}/` +
                    `${String(rawSource).replace(/^\/+/, "")}`;
                }
              }

              let normalized =
                normalizeSourceText(combined);

              normalized =
                normalized
                  .replace(/[?#].*$/, "");

              const candidates = [];

              if (
                normalized.startsWith("file://")
              ) {
                try {
                  candidates.push(
                    fileURLToPath(normalized)
                  );
                } catch {
                  // Continue with string matching.
                }
              } else if (
                path.isAbsolute(normalized)
              ) {
                candidates.push(
                  path.normalize(normalized)
                );
              } else {
                candidates.push(
                  path.resolve(
                    path.dirname(mapFile),
                    normalized
                  )
                );

                candidates.push(
                  path.resolve(
                    uiRoot,
                    normalized
                  )
                );
              }

              return [...new Set(candidates)];
            };

          const identifyLockKey = (
            rawSource,
            mapFile,
            sourceRoot
          ) => {
            const normalized =
              normalizeSourceText(rawSource);

            for (const key of lockKeysLongestFirst) {
              const marker = `/${key}/`;

              if (
                normalized.includes(marker) ||
                normalized.endsWith(`/${key}`) ||
                normalized.startsWith(`${key}/`) ||
                normalized === key
              ) {
                return {
                  key,
                  method: "lock-key-source-match",
                };
              }
            }

            for (
              const candidate of
              resolveSourceCandidates(
                rawSource,
                mapFile,
                sourceRoot
              )
            ) {
              if (!fs.existsSync(candidate)) {
                continue;
              }

              const key =
                nearestLockKeyForAbsolutePath(
                  candidate
                );

              if (key) {
                return {
                  key,
                  method: "resolved-source-path",
                };
              }
            }

            const name =
              sourcePackageName(rawSource);

            if (!name) {
              return null;
            }

            const candidates =
              lockByName.get(name) || [];

            if (candidates.length === 1) {
              return {
                key: candidates[0].key,
                method:
                  "unique-package-name-fallback",
              };
            }

            const versions = [
              ...new Set(
                candidates
                  .map((item) => item.version)
                  .filter(Boolean)
              ),
            ];

            if (
              candidates.length > 1 &&
              versions.length === 1
            ) {
              return {
                key: candidates
                  .map((item) => item.key)
                  .sort()[0],
                method:
                  "same-version-package-name-fallback",
              };
            }

            return {
              ambiguous: true,
              packageName: name,
              candidateKeys:
                candidates.map((item) => ({
                  key: item.key,
                  version: item.version,
                })),
            };
          };

          const usedLockKeys = new Set();
          const sourceEvidence = new Map();
          const mappingUnresolved = [];

          let productionSourceCount = 0;

          const recordSource = (
            source,
            mapFile,
            sourceRoot
          ) => {
            if (
              typeof source !== "string" ||
              !source
            ) {
              return;
            }

            productionSourceCount++;

            const normalized =
              normalizeSourceText(source);

            if (
              !normalized.includes("node_modules/")
            ) {
              return;
            }

            const match =
              identifyLockKey(
                source,
                mapFile,
                sourceRoot
              );

            if (!match) {
              mappingUnresolved.push({
                problem:
                  "node_modules source could not be mapped to package-lock",
                source,
                map:
                  path
                    .relative(outDir, mapFile)
                    .replace(/\\/g, "/"),
              });

              return;
            }

            if (match.ambiguous) {
              mappingUnresolved.push({
                problem:
                  "production source maps to multiple installed package versions",
                source,
                map:
                  path
                    .relative(outDir, mapFile)
                    .replace(/\\/g, "/"),
                packageName:
                  match.packageName,
                candidates:
                  match.candidateKeys,
              });

              return;
            }

            usedLockKeys.add(match.key);

            if (!sourceEvidence.has(match.key)) {
              sourceEvidence.set(
                match.key,
                []
              );
            }

            const evidence =
              sourceEvidence.get(match.key);

            if (evidence.length < 10) {
              evidence.push({
                source,
                map:
                  path
                    .relative(outDir, mapFile)
                    .replace(/\\/g, "/"),
                method:
                  match.method,
              });
            }
          };

          const inspectMapObject = (
            obj,
            mapFile,
            inheritedSourceRoot = ""
          ) => {
            if (!obj || typeof obj !== "object") {
              return;
            }

            const sourceRoot =
              typeof obj.sourceRoot === "string"
                ? obj.sourceRoot
                : inheritedSourceRoot;

            if (Array.isArray(obj.sources)) {
              for (const source of obj.sources) {
                recordSource(
                  source,
                  mapFile,
                  sourceRoot
                );
              }
            }

            if (Array.isArray(obj.sections)) {
              for (const section of obj.sections) {
                if (
                  section &&
                  typeof section === "object" &&
                  section.map
                ) {
                  inspectMapObject(
                    section.map,
                    mapFile,
                    sourceRoot
                  );
                }
              }
            }
          };

          for (const mapFile of mapFiles) {
            let map;

            try {
              map = JSON.parse(
                fs.readFileSync(
                  mapFile,
                  "utf8"
                )
              );
            } catch (err) {
              mappingUnresolved.push({
                problem:
                  "production source map could not be parsed",
                map:
                  path
                    .relative(outDir, mapFile)
                    .replace(/\\/g, "/"),
                detail: String(err),
              });

              continue;
            }

            inspectMapObject(
              map,
              mapFile
            );
          }

          if (productionSourceCount === 0) {
            throw new Error(
              "Production source maps contained zero source entries"
            );
          }

          if (usedLockKeys.size === 0) {
            throw new Error(
              "Production source maps resolved zero node_modules packages"
            );
          }

          const licenseNamePattern =
            /^(licen[sc]e|copying|notice|unlicense)([._-].*)?$/i;

          const dangerousLicensePattern =
            /\b(AGPL|GPL|LGPL|SSPL|BUSL|BSL-1\.1|Commons Clause|NonCommercial|NON-COMMERCIAL)\b/i;

          const safeLicenceIds = new Set([
            "MIT",
            "MIT-0",
            "ISC",
            "0BSD",
            "BSD",
            "BSD-2-Clause",
            "BSD-3-Clause",
            "Apache-2.0",
            "CC0-1.0",
            "Unlicense",
            "Zlib",
            "OFL-1.1",
          ]);

          const looksLikeMIT = (text) =>
            text.includes(
              "Permission is hereby granted, free of charge"
            ) &&
            text.includes(
              'THE SOFTWARE IS PROVIDED "AS IS"'
            );

          const isSafeLicenceExpression =
            (value) => {
              if (
                typeof value !== "string" ||
                !value.trim()
              ) {
                return false;
              }

              if (
                dangerousLicensePattern.test(value) ||
                /\bWITH\b/i.test(value)
              ) {
                return false;
              }

              const stripped =
                value
                  .replace(/[()]/g, " ")
                  .trim();

              const pieces =
                stripped
                  .split(/\s+(?:AND|OR)\s+/i)
                  .map((item) => item.trim())
                  .filter(Boolean);

              return (
                pieces.length > 0 &&
                pieces.every((item) =>
                  safeLicenceIds.has(item)
                )
              );
            };

          const entries = [];
          const unresolved = [
            ...mappingUnresolved,
          ];

          const seenPackageVersions =
            new Set();

          const usedItems = [
            ...usedLockKeys
          ]
            .map((key) => {
              const item = lockByKey.get(key);

              if (!item) {
                unresolved.push({
                  problem:
                    "source-map-selected lock key missing from package-lock index",
                  lockKey: key,
                });
              }

              return item;
            })
            .filter(Boolean)
            .sort((a, b) =>
              `${a.name}@${a.version}:${a.key}`
                .localeCompare(
                  `${b.name}@${b.version}:${b.key}`
                )
            );

          for (const item of usedItems) {
            const abs =
              path.join(uiRoot, item.key);

            const pkgJsonPath =
              path.join(abs, "package.json");

            if (!fs.existsSync(pkgJsonPath)) {
              unresolved.push({
                lockKey: item.key,
                problem:
                  "production package package.json missing",
              });

              continue;
            }

            let pkg;

            try {
              pkg = JSON.parse(
                fs.readFileSync(
                  pkgJsonPath,
                  "utf8"
                )
              );
            } catch (err) {
              unresolved.push({
                lockKey: item.key,
                problem:
                  "production package package.json could not be parsed",
                detail:
                  String(err),
              });

              continue;
            }

            const name =
              typeof pkg.name === "string" &&
              pkg.name
                ? pkg.name
                : item.name;

            const version =
              typeof pkg.version === "string" &&
              pkg.version
                ? pkg.version
                : item.version || "UNKNOWN";

            const dedupeKey =
              `${name}@${version}`;

            if (
              seenPackageVersions.has(
                dedupeKey
              )
            ) {
              continue;
            }

            seenPackageVersions.add(
              dedupeKey
            );

            let declaredLicense = "";

            if (
              typeof pkg.license === "string"
            ) {
              declaredLicense =
                pkg.license.trim();
            } else if (
              pkg.license &&
              typeof pkg.license.type ===
                "string"
            ) {
              declaredLicense =
                pkg.license.type.trim();
            } else if (
              Array.isArray(pkg.licenses)
            ) {
              declaredLicense =
                pkg.licenses
                  .map((x) =>
                    typeof x === "string"
                      ? x
                      : x &&
                          typeof x.type ===
                            "string"
                        ? x.type
                        : ""
                  )
                  .filter(Boolean)
                  .join(" OR ");
            } else if (
              typeof item.entry.license ===
                "string"
            ) {
              declaredLicense =
                item.entry.license.trim();
            }

            const requestedLicenceFiles =
              new Set();

            for (
              const fileName of
              fs.readdirSync(abs)
            ) {
              if (
                licenseNamePattern.test(
                  fileName
                )
              ) {
                requestedLicenceFiles.add(
                  fileName
                );
              }
            }

            const seeLicenseMatch =
              declaredLicense.match(
                /^SEE LICENSE IN\s+(.+)$/i
              );

            if (seeLicenseMatch) {
              const relativeLicense =
                seeLicenseMatch[1].trim();

              if (
                relativeLicense.includes("..") ||
                path.isAbsolute(
                  relativeLicense
                )
              ) {
                unresolved.push({
                  package: dedupeKey,
                  problem:
                    "unsafe SEE LICENSE IN path",
                  declaredLicense,
                });
              } else {
                requestedLicenceFiles.add(
                  relativeLicense
                );
              }
            }

            const packageDir =
              path.join(
                npmLicenseRoot,
                safeName(dedupeKey)
              );

            fs.mkdirSync(
              packageDir,
              { recursive: true }
            );

            const copiedLicenses = [];
            const licenceTexts = [];

            let copyIndex = 0;

            for (
              const sourceName of
              [...requestedLicenceFiles]
                .sort((a, b) =>
                  a.localeCompare(b)
                )
            ) {
              const sourcePath =
                path.join(abs, sourceName);

              let stat;

              try {
                stat =
                  fs.statSync(sourcePath);
              } catch {
                continue;
              }

              if (!stat.isFile()) {
                continue;
              }

              copyIndex++;

              const data =
                fs.readFileSync(sourcePath);

              const text =
                data.toString("utf8");

              licenceTexts.push(text);

              const targetName =
                `${String(copyIndex)
                  .padStart(2, "0")}-` +
                safeName(
                  path.basename(sourceName)
                ) +
                ".txt";

              const targetPath =
                path.join(
                  packageDir,
                  targetName
                );

              fs.writeFileSync(
                targetPath,
                data
              );

              copiedLicenses.push({
                sourceName,
                bundledPath:
                  path
                    .relative(
                      legalRoot,
                      targetPath
                    )
                    .split(path.sep)
                    .join("/"),
                sha256:
                  sha256(data),
                bytes:
                  data.length,
              });
            }

            const combinedLicenceText =
              licenceTexts.join("\n\n");

            let effectiveLicense =
              declaredLicense || "";

            let licenceBasis =
              declaredLicense
                ? "package metadata"
                : "";

            if (
              !effectiveLicense &&
              licenceTexts.length > 0 &&
              looksLikeMIT(
                combinedLicenceText
              ) &&
              !dangerousLicensePattern.test(
                combinedLicenceText
              )
            ) {
              effectiveLicense =
                "MIT";

              licenceBasis =
                "bundled licence text";
            }

            if (
              seeLicenseMatch &&
              copiedLicenses.length > 0
            ) {
              if (
                looksLikeMIT(
                  combinedLicenceText
                ) &&
                !dangerousLicensePattern.test(
                  combinedLicenceText
                )
              ) {
                effectiveLicense =
                  "MIT";

                licenceBasis =
                  "SEE LICENSE IN bundled MIT text";
              } else {
                effectiveLicense =
                  declaredLicense;

                licenceBasis =
                  "SEE LICENSE IN bundled text";
              }
            }

            const evidence =
              sourceEvidence.get(
                item.key
              ) || [];

            const inventoryItem = {
              name,
              version,
              effectiveLicense:
                effectiveLicense ||
                "UNKNOWN",
              declaredLicense:
                declaredLicense ||
                null,
              licenceBasis:
                licenceBasis ||
                null,
              lockKey:
                item.key,
              integrity:
                typeof item.entry
                  .integrity === "string"
                  ? item.entry.integrity
                  : null,
              resolved:
                typeof item.entry
                  .resolved === "string"
                  ? item.entry.resolved
                  : null,
              productionSourceEvidence:
                evidence,
              licenseFiles:
                copiedLicenses,
            };

            entries.push(
              inventoryItem
            );

            if (
              copiedLicenses.length === 0
            ) {
              unresolved.push({
                package:
                  dedupeKey,
                problem:
                  "production-bundle package has no bundled licence/notice text",
                declaredLicense:
                  declaredLicense ||
                  "UNKNOWN",
              });
            }

            if (!effectiveLicense) {
              unresolved.push({
                package:
                  dedupeKey,
                problem:
                  "production-bundle package licence could not be determined",
              });
            } else if (
              dangerousLicensePattern.test(
                effectiveLicense
              ) ||
              dangerousLicensePattern.test(
                combinedLicenceText
              )
            ) {
              unresolved.push({
                package:
                  dedupeKey,
                problem:
                  "production-bundle package licence requires manual review",
                effectiveLicense,
              });
            } else if (
              !seeLicenseMatch &&
              !isSafeLicenceExpression(
                effectiveLicense
              )
            ) {
              unresolved.push({
                package:
                  dedupeKey,
                problem:
                  "production-bundle package licence is outside automated permissive allow-list",
                effectiveLicense,
              });
            } else if (
              seeLicenseMatch &&
              effectiveLicense !== "MIT"
            ) {
              unresolved.push({
                package:
                  dedupeKey,
                problem:
                  "SEE LICENSE IN package requires manual review",
                effectiveLicense,
              });
            }
          }

          entries.sort((a, b) =>
            `${a.name}@${a.version}`
              .localeCompare(
                `${b.name}@${b.version}`
              )
          );

          unresolved.sort((a, b) =>
            JSON.stringify(a)
              .localeCompare(
                JSON.stringify(b)
              )
          );

          const inventory = {
            authority:
              "ggml-org/llama.cpp exact b10516 production Vite source maps + tools/ui/package-lock.json",
            packageLockVersion:
              lock.lockfileVersion ??
              null,
            sourceMapCount:
              mapFiles.length,
            productionSourceEntries:
              productionSourceCount,
            redistributedUniquePackages:
              entries.length,

            // Compatibility field for the current
            // downstream notice generator.
            // It will be renamed in the next edit.
            installedUniquePackages:
              entries.length,

            note:
              "Only packages whose source code is referenced by the exact b10516 production Vite source maps are treated as redistributed embedded-UI packages. Build/test/platform-only packages that do not enter the production browser bundle are excluded.",

            packages:
              entries,
          };

          fs.writeFileSync(
            path.join(
              legalRoot,
              "UI_NPM_INVENTORY.json"
            ),
            JSON.stringify(
              inventory,
              null,
              2
            ) + "\n",
            "utf8"
          );

          const packageSetText = [
            "Nativa llama.cpp b10516 embedded UI",
            "Production bundle package set",
            "",
            `Source maps: ${mapFiles.length}`,
            `Production source entries: ${productionSourceCount}`,
            `Redistributed unique packages: ${entries.length}`,
            "",
            ...entries.map(
              (item) =>
                `${item.name}@${item.version} | ` +
                `${item.effectiveLicense}`
            ),
            "",
          ].join("\n");

          fs.writeFileSync(
            path.join(
              legalRoot,
              "UI_PRODUCTION_PACKAGE_SET.txt"
            ),
            packageSetText,
            "utf8"
          );

          const sourceMapText = [
            "Nativa llama.cpp b10516 embedded UI",
            "Production source maps",
            "",
            ...mapFiles.map(
              (file) =>
                path
                  .relative(
                    outDir,
                    file
                  )
                  .replace(/\\/g, "/")
            ),
            "",
          ].join("\n");

          fs.writeFileSync(
            path.join(
              legalRoot,
              "UI_PRODUCTION_SOURCE_MAPS.txt"
            ),
            sourceMapText,
            "utf8"
          );

          const unresolvedText =
            unresolved.length
              ? [
                  "REVIEW REQUIRED",
                  "",
                  `Unresolved findings: ${unresolved.length}`,
                  "",
                  ...unresolved.map(
                    (item, index) =>
                      `${index + 1}. ${JSON.stringify(item)}`
                  ),
                  "",
                ].join("\n")
              : "NONE\n";

          fs.writeFileSync(
            path.join(
              legalRoot,
              "UNRESOLVED.txt"
            ),
            unresolvedText,
            "utf8"
          );

          fs.writeFileSync(
            path.join(
              legalRoot,
              "UNRESOLVED_COUNT.txt"
            ),
            String(
              unresolved.length
            ) + "\n",
            "utf8"
          );

          console.log(
            `Production source maps: ${mapFiles.length}`
          );

          console.log(
            `Production source entries: ${productionSourceCount}`
          );

          console.log(
            `Redistributed UI packages: ${entries.length}`
          );

          console.log(
            `Unresolved findings: ${unresolved.length}`
          );
          NODE
      - name: Resolve exact reviewed production licence exceptions
        shell: bash
        run: |
          set -euo pipefail

          legal="dist/$FINAL_ROOT/legal"
          review_dir="$legal/licenses/npm-reviewed"

          mkdir -p "$review_dir"

          curl \
            --location \
            --fail \
            --retry 3 \
            --output "$review_dir/rehype-katex__7.0.1__MIT.txt" \
            "https://raw.githubusercontent.com/remarkjs/remark-math/88a9497e1ede93b958237c85edbf5651faeca7af/license"

          curl \
            --location \
            --fail \
            --retry 3 \
            --output "$review_dir/remark-math__6.0.0__MIT.txt" \
            "https://raw.githubusercontent.com/remarkjs/remark-math/d5d0660b150810a535bbb07eac6cc96a4510aa24/license"

          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          legal = (
              Path("dist")
              / "llama-mac-arm64-b10516"
              / "legal"
          )

          inventory_path = (
              legal / "UI_NPM_INVENTORY.json"
          )

          unresolved_path = (
              legal / "UNRESOLVED.txt"
          )

          count_path = (
              legal / "UNRESOLVED_COUNT.txt"
          )

          if (
              count_path
              .read_text(encoding="utf-8")
              .strip()
              != "3"
          ):
              raise SystemExit(
                  "Expected exactly 3 pre-reviewed findings; STOP"
              )

          actual = []

          for line in unresolved_path.read_text(
              encoding="utf-8"
          ).splitlines():
              match = re.match(
                  r"^\d+\.\s+(\{.*\})$",
                  line,
              )

              if match:
                  actual.append(
                      json.loads(
                          match.group(1)
                      )
                  )

          expected = [
              {
                  "package":
                      "dompurify@3.4.13",
                  "problem":
                      "production-bundle package licence is outside automated permissive allow-list",
                  "effectiveLicense":
                      "(MPL-2.0 OR Apache-2.0)",
              },
              {
                  "package":
                      "rehype-katex@7.0.1",
                  "problem":
                      "production-bundle package has no bundled licence/notice text",
                  "declaredLicense":
                      "MIT",
              },
              {
                  "package":
                      "remark-math@6.0.0",
                  "problem":
                      "production-bundle package has no bundled licence/notice text",
                  "declaredLicense":
                      "MIT",
              },
          ]

          def canonical(value):
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
              )

          if (
              sorted(map(canonical, actual))
              !=
              sorted(map(canonical, expected))
          ):
              raise SystemExit(
                  "Findings differ from the exact reviewed set; STOP"
              )

          inventory = json.loads(
              inventory_path.read_text(
                  encoding="utf-8"
              )
          )

          items = {
              f"{item['name']}@{item['version']}":
                  item
              for item in inventory["packages"]
          }

          def require(key, declared):
              item = items.get(key)

              if (
                  not item
                  or
                  item.get("declaredLicense")
                  != declared
              ):
                  raise SystemExit(
                      f"{key} identity/licence metadata changed; STOP"
                  )

              return item

          dom = require(
              "dompurify@3.4.13",
              "(MPL-2.0 OR Apache-2.0)",
          )

          rehype = require(
              "rehype-katex@7.0.1",
              "MIT",
          )

          remark = require(
              "remark-math@6.0.0",
              "MIT",
          )

          apache_ok = False

          for licence in dom.get(
              "licenseFiles",
              [],
          ):
              path = (
                  legal
                  / licence["bundledPath"]
              )

              if not path.is_file():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              if (
                  "Apache License" in text
                  and
                  "Version 2.0, January 2004"
                  in text
              ):
                  apache_ok = True
                  break

          if not apache_ok:
              raise SystemExit(
                  "DOMPurify bundled Apache-2.0 text not found; STOP"
              )

          review_dir = (
              legal
              / "licenses"
              / "npm-reviewed"
          )

          reviewed_mit = [
              (
                  rehype,
                  review_dir
                  / "rehype-katex__7.0.1__MIT.txt",
                  "88a9497e1ede93b958237c85edbf5651faeca7af",
              ),
              (
                  remark,
                  review_dir
                  / "remark-math__6.0.0__MIT.txt",
                  "d5d0660b150810a535bbb07eac6cc96a4510aa24",
              ),
          ]

          for (
              item,
              path,
              commit,
          ) in reviewed_mit:

              data = path.read_bytes()

              text = data.decode(
                  "utf-8",
                  errors="strict",
              )

              if (
                  "Permission is hereby granted, free of charge"
                  not in text
                  or
                  'THE SOFTWARE IS PROVIDED "AS IS"'
                  not in text
              ):
                  raise SystemExit(
                      f"{item['name']} exact MIT text check failed; STOP"
                  )

              item["licenceBasis"] = (
                  "reviewed exact exception using immutable upstream source"
              )

              item["reviewedException"] = {
                  "selectedLicense":
                      "MIT",
                  "upstreamCommit":
                      commit,
              }

              item["licenseFiles"].append(
                  {
                      "sourceName":
                          "reviewed immutable upstream MIT licence",
                      "bundledPath":
                          path
                          .relative_to(legal)
                          .as_posix(),
                      "sha256":
                          hashlib
                          .sha256(data)
                          .hexdigest(),
                      "bytes":
                          len(data),
                  }
              )

          dom["effectiveLicense"] = (
              "Apache-2.0"
          )

          dom["licenceBasis"] = (
              "reviewed exact exception: Apache-2.0 selected from declared OR expression"
          )

          dom["reviewedException"] = {
              "selectedLicense":
                  "Apache-2.0",
              "upstreamCommit":
                  "3067f774676975de12306effd6db6ad7a9a8c17f",
          }

          inventory_path.write_text(
              json.dumps(
                  inventory,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          package_set = [
              "Nativa llama.cpp b10516 embedded UI",
              "Production bundle package set",
              "",
              (
                  f"Source maps: "
                  f"{inventory['sourceMapCount']}"
              ),
              (
                  f"Production source entries: "
                  f"{inventory['productionSourceEntries']}"
              ),
              (
                  f"Redistributed unique packages: "
                  f"{inventory['redistributedUniquePackages']}"
              ),
              "",
              *[
                  (
                      f"{item['name']}@{item['version']} | "
                      f"{item['effectiveLicense']}"
                  )
                  for item in inventory["packages"]
              ],
              "",
          ]

          (
              legal
              / "UI_PRODUCTION_PACKAGE_SET.txt"
          ).write_text(
              "\n".join(package_set),
              encoding="utf-8",
          )

          (
              legal
              / "REVIEWED_EXCEPTIONS.txt"
          ).write_text(
              """Nativa macOS b10516 reviewed npm licence exceptions

          dompurify@3.4.13
          Declared: (MPL-2.0 OR Apache-2.0)
          Selected: Apache-2.0
          Immutable upstream commit: 3067f774676975de12306effd6db6ad7a9a8c17f
          Evidence: exact npm package metadata plus bundled Apache-2.0 licence text

          rehype-katex@7.0.1
          Declared: MIT
          Selected: MIT
          Immutable upstream commit: 88a9497e1ede93b958237c85edbf5651faeca7af
          Evidence: exact npm package metadata plus immutable upstream MIT licence text

          remark-math@6.0.0
          Declared: MIT
          Selected: MIT
          Immutable upstream commit: d5d0660b150810a535bbb07eac6cc96a4510aa24
          Evidence: exact npm package metadata plus immutable upstream MIT licence text
          """,
              encoding="utf-8",
          )

          unresolved_path.write_text(
              "NONE\n",
              encoding="utf-8",
          )

          count_path.write_text(
              "0\n",
              encoding="utf-8",
          )

          print(
              "Exact reviewed exception resolver PASS: "
              "3 resolved, 0 remaining"
          )
          PY
      - name: Preserve frozen UI lockfile authority
        shell: bash
